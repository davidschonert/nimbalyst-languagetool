name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # The lower bound is what vite 7 requires, so it is worth proving.
        node-version: ['20.19', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Also validates the manifest against the rules the host applies at load
      # time. An invalid manifest makes Nimbalyst skip the whole extension.
      - name: Build
        run: npm run build
